<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adinath Sakhare — UI/UX Designer</title>
    <meta
      name="description"
      content="Adinath Sakhare (Adiii) is a UI/UX designer who designs SaaS products and websites, and uses AI tools with design judgment."
    />

    <meta name="theme-color" content="#ffffff" />
    <!-- Light is the default. Only a switch made earlier in this visit (e.g. before a refresh) is restored, before first paint. -->
    <script>
      try {
        var dark = sessionStorage.getItem('theme') === 'dark'
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0e1117')
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400&amp;family=Poppins:wght@300;400;500;600;700&amp;family=Protest+Revolution&amp;family=Silkscreen&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" sizes="192x192" href="./favicon.png?v=2" />
    <link rel="apple-touch-icon" href="./favicon.png?v=2" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
