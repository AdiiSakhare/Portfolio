<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Adinath Sakhare — UI/UX Designer</title>
    <!--
      GitHub Pages has no server rewrites, so a direct visit to /Portfolio/work/project-one lands here.
      This turns the path into a query (/Portfolio/?/work/project-one); index.html turns it back.
      pathSegmentsToKeep = 1 because the site lives under /Portfolio/. Use 0 on a custom domain.
    -->
    <script>
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
